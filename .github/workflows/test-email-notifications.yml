name: test-email-notifications

# Manual test path for the email-notifications batch (2026-08-25) — proves
# each of the four templates actually renders (subject + HTML body,
# printed to the job log either way) AND, once the two SMTP secrets exist,
# doubles as a genuine end-to-end SMTP test: real test emails land in the
# real inbox with a "[ТЕСТ]" subject prefix so they're never mistaken for
# a real pipeline notification. Before the secrets exist, this proves the
# OTHER half of the contract instead — the clean no-op with a log line,
# not a failure (see .github/actions/notify-email/action.yml).
#
# Uses synthetic fixture data (a fake report, a real-but-unmodified
# existing article file for the article-pr template, a real-but-already-
# published slug for the published template) — this workflow never writes
# to generated-articles/, _headers, or blog-articles.json. Read-only,
# safe to run any time. See tools/blog-generator/README.md, "Email
# notifications," for the full record.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which template to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - article-pr
          - rejected-pr
          - published
          - failure
          - marker-merged
          - checkgen-structured
          - checkgen-log
          - checkgen-log-ambiguous
          - checkgen-neutral

jobs:
  test:
    name: Build + send test email(s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TWO synthetic reports, deliberately different shapes:
      # test-report-article.json (outcome: 'generated', for the article-pr
      # template -- outputPath points at a REAL, already-published article
      # file so first-paragraph extraction exercises real content_html)
      # and test-report-rejected.json (outcome: 'schema_invalid', for the
      # rejected-pr template -- a real rejection outcome, not 'generated',
      # so deriveFailureClassLabel() renders a real failure-class label
      # instead of the wrong one a 'generated' outcome would produce).
      - name: Write synthetic report fixtures
        run: |
          cat > /tmp/test-report-article.json <<'EOF'
          {
            "topic": { "topic": "[ТЕСТ] Пример темы" },
            "outcome": "generated",
            "allSilent": false,
            "layer1": { "tripped": false, "findings": [] },
            "layer2": { "tripped": false, "checklist": {} },
            "layer3": { "tripped": false, "failed": [], "unsupported": [] },
            "selfReview": { "violationsFound": ["[ТЕСТ] пример правки"] },
            "article": { "title": "[ТЕСТ] Пример заголовка статьи", "slug": "test-fixture" },
            "outputPath": "src/data/generated-articles/redhawk-temecula-neighborhood-guide.json"
          }
          EOF
          cat > /tmp/test-report-rejected.json <<'EOF'
          {
            "topic": { "topic": "[ТЕСТ] Пример темы для проверки отклонённой попытки" },
            "outcome": "schema_invalid",
            "layer1": { "tripped": false, "findings": [] },
            "layer2": { "tripped": false, "checklist": {} },
            "layer3": { "tripped": false, "failed": [], "unsupported": [] },
            "schemaErrors": ["[ТЕСТ] citations[]: пример ошибки схемы"]
          }
          EOF

      - name: Build + send — article-pr
        if: github.event.inputs.kind == 'article-pr' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: article_pr
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=article-pr \
            --report=/tmp/test-report-article.json \
            --preview-url=https://example.igor-r.pages.dev \
            --pr-url=https://github.com/drstas-cyber/IGOR_r/pull/0
      - name: Notify (email) — test article-pr
        if: github.event.inputs.kind == 'article-pr' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.article_pr.outputs.subject }}"
          html_body: ${{ steps.article_pr.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      - name: Build + send — rejected-pr
        if: github.event.inputs.kind == 'rejected-pr' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: rejected_pr
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=rejected-pr \
            --report=/tmp/test-report-rejected.json \
            --pr-url=https://github.com/drstas-cyber/IGOR_r/pull/0
      - name: Notify (email) — test rejected-pr
        if: github.event.inputs.kind == 'rejected-pr' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.rejected_pr.outputs.subject }}"
          html_body: ${{ steps.rejected_pr.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      # Real, already-published slug -- read-only (evaluatePublishStatus
      # only reads files, never writes), so this is safe to run any time
      # and doubles as a real proof the "published" template correctly
      # reads live repo state.
      - name: Build + send — published
        if: github.event.inputs.kind == 'published' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: published
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=published \
            --slug=redhawk-temecula-neighborhood-guide
      - name: Notify (email) — test published
        if: github.event.inputs.kind == 'published' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.published.outputs.subject }}"
          html_body: ${{ steps.published.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      - name: Build + send — failure
        if: github.event.inputs.kind == 'failure' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: failure_kind
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=failure \
            --reason="[ТЕСТ] пример причины сбоя" \
            --detail="[ТЕСТ] Это тестовое письмо, отправленное вручную через workflow_dispatch, чтобы проверить рендеринг шаблона и (если секреты уже настроены) сквозную доставку по SMTP." \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify (email) — test failure
        if: github.event.inputs.kind == 'failure' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.failure_kind.outputs.subject }}"
          html_body: ${{ steps.failure_kind.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      # ----------------------------------------------------------------
      # checkGenerateFailureReason.mjs precedence-chain proof (2026-08-31,
      # tactical item 3a of the manual-publish formalization) — dispatches
      # all three precedence branches (structured / log-fallback / neutral)
      # PLUS the "log exists but carries no recognized signal" case
      # (log-ambiguous — proves the honest "cause could not be pinned down
      # from the report" caveat fires instead of a guess) through the REAL
      # email action: observed-in-inbox proof, not just a unit test's
      # mocked assertion. Each branch is a three-step chain (checker ->
      # build -> notify), matching the pattern above, with its own
      # isolated fixture report/log path so none of the four interfere
      # with each other or with a real .last-run-report.json/generate.log
      # (this workflow is workflow_dispatch-only, so that never actually
      # happens, but isolated paths cost nothing and rule it out by
      # construction anyway).
      # ----------------------------------------------------------------
      # marker-merged (added 2026-09-03, "no unfired paths" hardening order,
      # path EM-08). This was the ONE email template with no drill kind
      # here at all -- the only proof it rendered was its unit test, while
      # its calling job (publish-on-merge.yml's
      # notify-marker-merged-by-mistake) has never executed its body in
      # production either. Two unfired layers stacked on the same path.
      # pipeline-drill.yml exercises this same template weekly from a REAL
      # git detection; this step is the on-demand version.
      - name: Build + send — marker-merged
        if: github.event.inputs.kind == 'marker-merged' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: marker_merged
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs             --kind=marker-merged             --topic="[ТЕСТ] Пример темы отклонённой попытки"             --marker-file="src/data/generated-articles/.rejected/test-fixture.json"             --pr-url=https://github.com/drstas-cyber/IGOR_r/pull/0
      - name: Notify (email) — test marker-merged
        if: github.event.inputs.kind == 'marker-merged' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.marker_merged.outputs.subject }}"
          html_body: ${{ steps.marker_merged.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      - name: Fixture + check — checkgen-structured (precedence 1)
        if: github.event.inputs.kind == 'checkgen-structured' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_structured_check
        run: |
          cat > /tmp/test-checkgen-structured-report.json <<'EOF'
          {
            "generatedAt": "2026-08-31T00:00:00.000Z",
            "outcome": "identity_incomplete",
            "identityErrors": ["[ТЕСТ] missing DRE number", "[ТЕСТ] missing phone number"]
          }
          EOF
          node tools/blog-generator/checkGenerateFailureReason.mjs \
            --report-path=/tmp/test-checkgen-structured-report.json \
            --log-path=/tmp/test-checkgen-structured-nolog.log \
            --detail-out=/tmp/test-checkgen-structured-detail.txt \
            >> "$GITHUB_OUTPUT"
      - name: Build + send — checkgen-structured
        if: github.event.inputs.kind == 'checkgen-structured' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_structured
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=failure \
            --reason="[ТЕСТ] ${{ steps.checkgen_structured_check.outputs.reason }}" \
            --detail-file=/tmp/test-checkgen-structured-detail.txt \
            --slug="${{ steps.checkgen_structured_check.outputs.slug }}" \
            --failure-class="${{ steps.checkgen_structured_check.outputs.failure_class }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify (email) — test checkgen-structured
        if: github.event.inputs.kind == 'checkgen-structured' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.checkgen_structured.outputs.subject }}"
          html_body: ${{ steps.checkgen_structured.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      - name: Fixture + check — checkgen-log (precedence 2, recognized sentinel)
        if: github.event.inputs.kind == 'checkgen-log' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_log_check
        run: |
          cat > /tmp/test-checkgen-log-log.log <<'EOF'
          [ТЕСТ] some setup noise before the real signal
          ::error::[generate] QUEUE EXHAUSTED — every topic in topics.json has already been attempted (real article or open rejected-attempt PR).
          EOF
          node tools/blog-generator/checkGenerateFailureReason.mjs \
            --report-path=/tmp/test-checkgen-log-noreport.json \
            --log-path=/tmp/test-checkgen-log-log.log \
            --detail-out=/tmp/test-checkgen-log-detail.txt \
            >> "$GITHUB_OUTPUT"
      - name: Build + send — checkgen-log
        if: github.event.inputs.kind == 'checkgen-log' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_log
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=failure \
            --reason="[ТЕСТ] ${{ steps.checkgen_log_check.outputs.reason }}" \
            --detail-file=/tmp/test-checkgen-log-detail.txt \
            --slug="${{ steps.checkgen_log_check.outputs.slug }}" \
            --failure-class="${{ steps.checkgen_log_check.outputs.failure_class }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify (email) — test checkgen-log
        if: github.event.inputs.kind == 'checkgen-log' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.checkgen_log.outputs.subject }}"
          html_body: ${{ steps.checkgen_log.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      # THE NO-REPORT-AMBIGUITY CASE: a log exists (something was
      # captured) but carries no recognized signal — proves the system
      # says "cause could not be pinned down from the report" and still
      # attaches the real captured text, rather than defaulting to a named
      # guess (the exact failure mode this whole tactical pass exists to
      # rule out).
      - name: Fixture + check — checkgen-log-ambiguous (no recognized signal)
        if: github.event.inputs.kind == 'checkgen-log-ambiguous' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_log_ambiguous_check
        run: |
          cat > /tmp/test-checkgen-ambig-log.log <<'EOF'
          [ТЕСТ] Error: ENOSPC: no space left on device, write
          EOF
          node tools/blog-generator/checkGenerateFailureReason.mjs \
            --report-path=/tmp/test-checkgen-ambig-noreport.json \
            --log-path=/tmp/test-checkgen-ambig-log.log \
            --detail-out=/tmp/test-checkgen-ambig-detail.txt \
            >> "$GITHUB_OUTPUT"
      - name: Build + send — checkgen-log-ambiguous
        if: github.event.inputs.kind == 'checkgen-log-ambiguous' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_log_ambiguous
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=failure \
            --reason="[ТЕСТ] ${{ steps.checkgen_log_ambiguous_check.outputs.reason }}" \
            --detail-file=/tmp/test-checkgen-ambig-detail.txt \
            --slug="${{ steps.checkgen_log_ambiguous_check.outputs.slug }}" \
            --failure-class="${{ steps.checkgen_log_ambiguous_check.outputs.failure_class }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify (email) — test checkgen-log-ambiguous
        if: github.event.inputs.kind == 'checkgen-log-ambiguous' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.checkgen_log_ambiguous.outputs.subject }}"
          html_body: ${{ steps.checkgen_log_ambiguous.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      - name: Fixture + check — checkgen-neutral (precedence 3, no report and no log)
        if: github.event.inputs.kind == 'checkgen-neutral' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_neutral_check
        run: |
          node tools/blog-generator/checkGenerateFailureReason.mjs \
            --report-path=/tmp/test-checkgen-neutral-noreport.json \
            --log-path=/tmp/test-checkgen-neutral-nolog.log \
            --detail-out=/tmp/test-checkgen-neutral-detail.txt \
            >> "$GITHUB_OUTPUT"
      - name: Build + send — checkgen-neutral
        if: github.event.inputs.kind == 'checkgen-neutral' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        id: checkgen_neutral
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=failure \
            --reason="[ТЕСТ] ${{ steps.checkgen_neutral_check.outputs.reason }}" \
            --detail-file=/tmp/test-checkgen-neutral-detail.txt \
            --slug="${{ steps.checkgen_neutral_check.outputs.slug }}" \
            --failure-class="${{ steps.checkgen_neutral_check.outputs.failure_class }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify (email) — test checkgen-neutral
        if: github.event.inputs.kind == 'checkgen-neutral' || github.event.inputs.kind == 'all' || github.event.inputs.kind == ''
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: "[ТЕСТ] ${{ steps.checkgen_neutral.outputs.subject }}"
          html_body: ${{ steps.checkgen_neutral.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
