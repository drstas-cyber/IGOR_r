name: publish-on-merge

# Hardening batch item 3, 2026-08-25 — the standing spec: when a human
# merges a `blog-generator/auto-*` PR (a real-article generator PR, never
# a `blog-generator/rejected-*` marker PR), that merge itself triggers the
# full publish sequence a human previously had to run by hand afterward in
# a separate terminal session (published:true flip, regenerate
# blog-articles.json, commit, push) — see
# tools/blog-generator/publishOnMerge.mjs for the actual logic and
# tools/blog-generator/README.md's "Publish-on-merge" entry for the full
# design record. First live test: the next held PR merged from the GitHub
# mobile app, per the instruction that asked for this.
#
# Deliberately scoped to `blog-generator/auto-*` only — a
# `blog-generator/rejected-*` marker PR has no article to publish.
#
# THE SOLE PUBLISH MECHANISM (owner ruling, 2026-08-31, manual-publish
# formalization): generate-article.yml's auto-merge/auto-publish path is
# retired -- every article, silent or not, now reaches this workflow only
# via a human tapping Merge. Historically (2026-08-25 through 2026-08-31)
# a perfectly-silent PR could ALSO have been auto-merged/auto-published by
# generate-article.yml itself before a human ever saw this workflow fire
# for it -- publishOnMerge.mjs's own idempotency check (evaluatePublishStatus)
# made that a clean, silent no-op rather than a double-publish, and still
# does (defense-in-depth is still worth keeping even though the scenario
# it was defending against no longer exists).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: publish-on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the merged article
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'blog-generator/auto-')
    steps:
      # Checks out main fresh rather than trusting the pull_request event's
      # own ref -- never assume what state a merge-event checkout leaves
      # the workspace in.
      #
      # fetch-depth: 2 (2026-08-31, FIX 1 -- see README.md's "Publish-on-
      # merge" decision record for the full incident). The default (1)
      # clones ONLY the merge commit itself -- no parent -- but
      # publishOnMerge.mjs's getMergedArticleSlug() runs
      # `git diff <merge-sha>~1 <merge-sha>` to find what the PR added,
      # and `~1` (the merge commit's first parent) doesn't exist in a
      # depth-1 clone: git returns "bad revision," the step fails before
      # any write. This was this workflow's actual first-live-firing
      # failure (PR #38, run 33363712388), not a hypothetical. Depth 2 is
      # the minimal fix: the merge commit checked out here IS main's tip
      # (this workflow only ever runs post-merge), so its first parent is
      # exactly the second commit a depth-2 clone includes -- nothing
      # deeper is ever dereferenced. fetch-depth: 0 (full history) would
      # also work and is more robust against a future change to what this
      # workflow diffs, but costs a full clone for no reason THIS specific
      # need requires -- not chosen.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Idempotent by construction (see publishOnMerge.mjs's header
      # comment) -- an already-fully-published article is a clean no-op
      # here, not a double-publish (historically this mattered because the
      # now-retired auto-publish path in generate-article.yml could have
      # already handled this exact PR before a human ever merged it; kept
      # as defense-in-depth even though that scenario no longer exists).
      # FAIL-CLOSED ON BROKEN HEADER COVERAGE (Batch F, Option D): this
      # step VALIDATES the shared /blog/:slug article-cache contract in
      # public/_headers; it does NOT add two rules per article any more, so
      # the 100-rule cap is not a routine publication failure mode. What IS
      # routine: if that shared coverage is missing, duplicated, or carries
      # the wrong Cache-Control, publishOnMerge.mjs throws here and this
      # step fails BEFORE any commit -- the article stays merged on main
      # but published:false, a safe, visibly-incomplete state (see
      # publishOnMerge.mjs's header comment for the full failure-mode
      # reasoning).
      #
      # Output captured to a log file (2026-08-31, FIX 2) so a red run's
      # notification email can report what ACTUALLY failed instead of a
      # guess -- see the "Build email content (red run...)" step below and
      # README.md's "Publish-on-merge" decision record. `set -o pipefail`
      # is what makes the step still fail on a non-zero exit from `node`
      # through the pipe to `tee` -- without it, bash reports the
      # PIPELINE's exit status as `tee`'s (normally 0), silently masking a
      # real failure. `node`'s own $GITHUB_OUTPUT writes (slug, then
      # already_complete -- see publishOnMerge.mjs) happen directly to the
      # runner's output file regardless of this piping.
      # BATCH F (Option D): this step no longer writes public/_headers.
      # Article cache coverage comes from the two shared /blog/:slug
      # placeholder rules, so publication adds nothing to that file; the
      # step now VALIDATES that shared contract and fails closed if it is
      # broken. public/_headers stays in the `git add` below deliberately:
      # it is a no-op while the file is unchanged, and it keeps the commit
      # correct if a future step ever does touch it.
      - name: Flip published:true and validate shared _headers coverage
        id: publish
        run: |
          set -o pipefail
          node tools/blog-generator/publishOnMerge.mjs --merge-sha="${{ github.event.pull_request.merge_commit_sha }}" 2>&1 | tee /tmp/publish-on-merge.log

      - name: Regenerate blog-articles.json
        if: steps.publish.outputs.already_complete == 'false'
        run: node tools/fetch-blog-data.js

      # GITHUB_TOKEN CASCADE NOTE (explicitly requested, recorded here):
      # this push uses the default GITHUB_TOKEN. GitHub does not trigger
      # OTHER workflows' `push:` triggers from a push made with
      # GITHUB_TOKEN (loop-prevention, by design) -- meaning THIS commit
      # does NOT automatically re-run build-check.yml the way a normal
      # human push (using a personal token) would. The commit still lands
      # on main and Cloudflare Pages' own separate GitHub App integration
      # deploys it regardless (that integration is not a GITHUB_TOKEN-
      # triggered workflow and is unaffected by this limitation) -- so the
      # SITE still updates correctly. What's missing is the automatic
      # post-publish build-check confirmation a human push gets for free.
      # Residual risk is low (blog-articles.json's regeneration is
      # deterministic and already covered by fetch-blog-data.test.mjs, and
      # the coverage validation above already catches the one way this
      # write path is known to fail) but not zero -- if this ever needs
      # closing, the fix is a PAT-backed push instead of GITHUB_TOKEN,
      # not something to
      # silently assume is already covered.
      - name: Commit and push
        if: steps.publish.outputs.already_complete == 'false'
        run: |
          SLUG="${{ steps.publish.outputs.slug }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/data/generated-articles/${SLUG}.json" public/_headers src/data/blog-articles.json
          git commit -m "blog: publish \"$SLUG\" (auto, publish-on-merge — PR #${{ github.event.pull_request.number }})

          Merge + published:true flip + blog-articles.json regenerate,
          done automatically by
          publish-on-merge.yml immediately after a human merged this PR
          (${{ github.event.pull_request.html_url }}). See
          tools/blog-generator/README.md, \"Publish-on-merge,\" for the
          full design record.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin main

      - name: No-op (already fully published)
        if: steps.publish.outputs.already_complete == 'true'
        run: echo "\"${{ steps.publish.outputs.slug }}\" was already fully published (e.g. this workflow already fired once for this PR) -- nothing to do."

      # ----------------------------------------------------------------
      # Email notifications (added 2026-08-25) — non-gating everywhere,
      # same discipline as generate-article.yml's own notify steps (see
      # that workflow's comment block and tools/blog-generator/README.md,
      # "Email notifications," for the full record).
      # ----------------------------------------------------------------
      - name: Build email content (published — publish-on-merge)
        id: email_published
        if: success() && steps.publish.outputs.already_complete == 'false'
        continue-on-error: true
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=published \
            --slug="${{ steps.publish.outputs.slug }}"

      - name: Notify (email) — published (publish-on-merge)
        if: success() && steps.publish.outputs.already_complete == 'false'
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: ${{ steps.email_published.outputs.subject }}
          html_body: ${{ steps.email_published.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      # Red-run notification (2026-08-31, FIX 2 + FIX 3 -- see README.md's
      # "Publish-on-merge" decision record). The --detail used to be a
      # hardcoded guess ("probably the _headers cap") written before this
      # workflow had ever run -- wrong on its actual first failure (an
      # unrelated shallow-checkout bug). It now reads the real captured
      # output of the publish step (--detail-log, written by that step's
      # `tee` above) through buildFailureDetail() -- see publishOnMerge.mjs
      # -- which reports the real captured error and nothing invented. It
      # retains one named special case for the _headers cap error, but that
      # branch is DORMANT as of Batch F: nothing in routine publication
      # writes _headers, so nothing can raise it. It is kept for a future
      # change that reintroduces a writer, not because a routine publish
      # can still hit the cap. `failure()`
      # is deliberate and explicit -- this must only fire on a real red
      # run.
      #
      # --slug always passes the flag (possibly empty) rather than omitting
      # it, so buildNotificationEmailCli.mjs can tell "known to be
      # inapplicable" (empty) apart from "caller has no slug concept"
      # (flag absent entirely, generate-article.yml's case) -- see that
      # file's --kind=failure handling. Empty here means the publish step
      # failed before getMergedArticleSlug() resolved a slug at all (e.g.
      # the 2026-08-30 incident) -- publishOnMerge.mjs's onSlugKnown only
      # writes this output once the slug is actually known.
      - name: Build email content (red run — publish-on-merge failed)
        id: email_failure
        if: failure()
        continue-on-error: true
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=failure \
            --reason="publish-on-merge (PR #${{ github.event.pull_request.number }})" \
            --detail-log=/tmp/publish-on-merge.log \
            --slug="${{ steps.publish.outputs.slug }}" \
            --failure-class=article_stranded \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify (email) — red run
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: ${{ steps.email_failure.outputs.subject }}
          html_body: ${{ steps.email_failure.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

  # confirm-rejection-recorded (was notify-marker-merged-by-mistake,
  # 2026-09-01 PR #41 incident; REFRAMED at the Phase 3 cutover). The
  # `publish` job above is deliberately scoped to `blog-generator/auto-*`
  # only (see this file's header comment), so a `blog-generator/rejected-*`
  # PR merge reaches nothing else in this workflow.
  #
  # PHASE 3 / MODEL A: merging a rejected-attempt PR is now the NORMAL,
  # CORRECT action -- it accepts the rejection and persists both the audit
  # marker and the quarantine transition. It is no longer an operator
  # mistake, and the topic is no longer "permanently blocked": the merged
  # marker is audit history and the quarantine record that landed with it
  # governs availability, expiring on the canonical 7/14/30/60 policy.
  # This job is therefore a CONFIRMATION step -- it reports what was
  # recorded, including the attempt number and the next eligible retry
  # date.
  #
  # Still notification-only, and deliberately NOT a quarantine writer: the
  # single runtime writer is generate-article. This job validates and
  # reports persisted state, it never mutates it.
  confirm-rejection-recorded:
    name: Confirm — a rejection was recorded (marker + quarantine)
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'blog-generator/rejected-')
    steps:
      # Same fetch-depth: 2 reasoning as the publish job above --
      # markerMerged.mjs's getMergedMarkerFiles() runs the same
      # `git diff <merge-sha>~1 <merge-sha>` shape and needs the merge
      # commit's parent present in the shallow clone.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-fatal by construction (markerMerged.mjs's isMain block never
      # throws past its own try/catch -- see that file's header comment) --
      # a bug here must cost a less-specific email, never fail a merge that
      # has already legitimately landed.
      - name: Identify the merged marker file and its topic
        id: detect_marker
        continue-on-error: true
        run: |
          node tools/blog-generator/markerMerged.mjs --merge-sha="${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build email content (rejection recorded)
        id: email_marker_merged
        continue-on-error: true
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=marker-merged \
            --topic="${{ steps.detect_marker.outputs.topic }}" \
            --marker-file="${{ steps.detect_marker.outputs.marker_file }}" \
            --pr-url="${{ github.event.pull_request.html_url }}"

      - name: Notify (email) — rejection recorded
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: ${{ steps.email_marker_merged.outputs.subject }}
          html_body: ${{ steps.email_marker_merged.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
