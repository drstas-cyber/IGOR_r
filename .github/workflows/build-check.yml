name: build-check

# Two jobs, deliberately parallel rather than sequential:
#
#   unit   — the full node:test suite (all *.test.mjs under tools/)
#   build  — the production build + route assertions
#
# WHY `unit` EXISTS (added 2026-09-03, "no unfired paths" hardening order,
# item 4). Until this commit, this repo had ~470 unit and end-to-end tests
# that NO workflow ever ran. They were executed only when a human
# remembered to type `node --test` locally. Every regression guard in
# tools/blog-generator/ -- the fetch-depth assertion written after the
# 2026-08-31 publish incident, the prompt/gate freeze written after the
# 2026-09-03 rule-10 incident, the fail-closed topic-availability tests --
# was a guard that could not fail a push. A suite nobody runs is not a
# suite; it is documentation with a misleading file extension.
#
# The two jobs are independent on purpose: a red unit suite must not be
# masked by a green build, and a broken build must not be masked by green
# tests. Both are required for the push to be green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit + end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The glob form, not `node --test tools/`. Node 22+ on some platforms
      # fails to resolve a bare directory argument here ("Cannot find
      # module"); the glob is what the local workflow uses and what is
      # actually verified to work. Both test directories are named
      # explicitly rather than globbing the repo, so a stray *.test.mjs
      # somewhere unexpected does not silently join the required suite.
      #
      # TOP-LEVEL tools tests, added 2026-09-04 (Phase 6B1). Until this
      # change, tools/*.test.mjs ran in NO workflow -- they were green
      # only when a human remembered to type `node --test` locally. That
      # made every guard in them inert in CI, including the Phase 6A1
      # guards in build-chain.test.mjs that exist to stop the shell-
      # dependent `|| true` build script from coming back.
      #
      # The three safe files are named EXPLICITLY rather than swept in
      # with a `tools/*.test.mjs` glob, for the same reason the two
      # directories above are: a glob would silently enlist every future
      # top-level test with no review, and would pull in the one file
      # deliberately left out below.
      #
      # tools/fetch-blog-data.test.mjs is deliberately excluded for now: it
      # writes/restores tracked src/data/blog-articles.json and creates a
      # synthetic article under src/data/generated-articles/. It is careful
      # (snapshot/restore, collision assertion, cleanup in finally), and on
      # an ephemeral CI runner it would be harmless, but an interrupted run
      # leaves debris in a tracked directory, and it spawns the real
      # fetch-blog-data.js rather than an injected stand-in. Move it to
      # isolated temp fixtures in a later 6B2 batch before adding it to CI.
      #
      # Note for that batch: writing into the real src/data/generated-
      # articles/ is NOT unique to it -- tools/blog-generator/merge.test.mjs
      # does the same and is already in CI here. So temp-fixture isolation
      # is a codebase-wide cleanup, not a precondition unique to
      # fetch-blog-data. The gap still matters: fetch-blog-data.js is a
      # FATAL build step with no CI-enforced regression cover until it lands.
      - name: Run the full test suite
        run: node --test tools/build-chain.test.mjs tools/seo-prerender.test.mjs tools/silentDropGuard.test.mjs "tools/blog-generator/*.test.mjs" "tools/blog-compliance/*.test.mjs"

      - name: Lint the tooling (not the vendored 001_web bundle)
        run: npx eslint tools/ --quiet

  build:
    name: Build on push & PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build produced expected routes
        run: |
          test -f dist/index.html
          test -f dist/homes-for-sale-temecula/index.html
          test -f dist/sell-my-house/index.html
          test -f dist/contact/index.html
          test -f dist/russian-speaking-realtor-temecula/index.html
          test -f dist/about-george/index.html
          test -f dist/sitemap.xml
          test -f dist/version.json
