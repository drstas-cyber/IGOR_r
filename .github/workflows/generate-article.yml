name: generate-article

# Cadence changed 2026-08-03 (owner decision, supersedes the 2026-08-01
# weekly-cron decision): every other day, 14:00 UTC. See
# tools/blog-generator/README.md, "Automated publishing" for the full
# record. `*/2` in the day-of-month field means "every odd day of the
# month" (1,3,5,...,31) -- accepted, known quirk: a 31-day month fires on
# day 31 AND day 1 of the next month on consecutive calendar days, since
# cron has no "every N days" concept that survives a month boundary. The
# clean alternative (`0 14 * * 1,3,5`, Mon/Wed/Fri) was considered and
# rejected: it changes the cadence to 3 fixed weekdays/week with an
# irregular 3-day Fri->Mon gap, which isn't "every other day" so much as a
# different schedule shape -- `*/2` stays truer to what was actually
# asked for, and the quirk's worst case (one extra generation attempt,
# ~7x/year, consuming at most one topic) is immaterial at this pipeline's
# cost and volume.
#
# Auto-publish note (2026-08-03): a PR this schedule opens now merges AND
# publishes automatically, but ONLY when the run was perfectly silent --
# see the "Check whether the run was perfectly silent" / "Auto-merge" /
# "Publish" steps below and README.md's "Automated publishing" section.
# ANY finding anywhere, including a log-only one, still holds the PR for
# a supervised human read exactly as before this change. Cron controls
# generation cadence; it does not weaken what gets published unread.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 14 */2 * *'  # every other day (odd days of month), 14:00 UTC / 7am Pacific (PDT)

permissions:
  contents: write
  pull-requests: write

# Manual-dispatch-only makes a true simultaneous double-trigger unlikely, but
# not impossible (two people, or one person double-clicking) -- and the
# ground-truth topic check (topicAvailability.mjs) reads "already attempted"
# once at the start of a run; two runs starting close together could both
# read the same not-yet-attempted topic before either's PR exists to make it
# unavailable to the other, producing the exact same-topic collision this
# whole redesign exists to prevent (see the "topic selection" commit).
# cancel-in-progress: false queues a second trigger behind the first rather
# than killing an in-flight run -- cancelling mid-run would abandon a
# half-done generation and, worse, could race the PR-open step against a
# cancellation signal. A queued run costs a few minutes' wait, not a
# correctness bug.
concurrency:
  group: generate-article
  cancel-in-progress: false

jobs:
  generate:
    name: Generate one article and open a review PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Output captured to a log file (2026-08-31, notification-hardening
      # pass, Task 3) so a red run's email can read the REAL captured
      # output instead of guessing -- same reasoning and same `set -o
      # pipefail` requirement as publish-on-merge.yml's own fix the day
      # before (see that workflow's own comment on this exact step shape):
      # without pipefail, this step would report success on `tee`'s exit
      # code even when `node` itself failed, silently masking a real
      # failure through the pipe.
      - name: Run generator (writer + self-review + both compliance gates)
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node tools/blog-generator/generate.mjs 2>&1 | tee /tmp/generate.log

      # The `.topic` key check (2026-08-31) -- generate.mjs now writes a
      # MINIMAL report ({generatedAt, outcome} only, no topic/layer1/etc.)
      # on three early-exit paths it didn't write anything for before this
      # pass (missing ANTHROPIC_API_KEY, missing GITHUB_REPOSITORY, an
      # uncaught exception during topic selection -- see generate.mjs's
      # early-exit reports and README.md's decision record). render-
      # report-md.mjs unconditionally dereferences report.topic.topic and
      # report.layer1.tripped -- it would crash on one of these minimal
      # reports. None of those three scenarios ever opens a PR (has_new_
      # article and has_rejected_marker are both false for all of them),
      # so steps.report.outputs.body is never actually consumed in those
      # cases either way -- this guard just keeps this step from adding a
      # spurious extra red mark to the job for no benefit. Checking for a
      # literal `"topic":` key (not enumerating the specific new outcome
      # values) is deliberately shape-based, not a hardcoded outcome list,
      # so it stays correct for any future minimal-report addition too.
      - name: Render gate report as Markdown (always, even on failure/skip)
        if: always()
        id: report
        run: |
          if [ -f tools/blog-generator/.last-run-report.json ] && grep -q '"topic":' tools/blog-generator/.last-run-report.json; then
            {
              echo 'body<<GENERATE_REPORT_EOF'
              node tools/blog-generator/render-report-md.mjs
              echo 'GENERATE_REPORT_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=No report was written — the run failed before producing one. Check the job log above.' >> "$GITHUB_OUTPUT"
          fi

      # Excludes .rejected/ explicitly — a gate trip writes a marker there,
      # not a real article, and must never trigger this step (see
      # has_rejected_marker below, which is the mutually-exclusive sibling
      # check). Belt-and-suspenders: the two write paths never overlap by
      # construction either (handleTrippedGate in generate.mjs only ever
      # writes under .rejected/, the real-article write only ever writes
      # directly under generated-articles/), but this check stays explicit
      # rather than relying on that alone.
      - name: Check whether an article was actually generated
        id: check
        if: always()
        run: |
          if git status --porcelain -- src/data/generated-articles/ | grep -v '/\.rejected/' | grep -q '^??'; then
            echo 'has_new_article=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_new_article=false' >> "$GITHUB_OUTPUT"
          fi

      # Mutually exclusive with has_new_article above by construction — see
      # handleTrippedGate in generate.mjs (tools/blog-generator/README.md
      # has the full design rationale for why a gate trip OR a schema-
      # validation failure gets its own PR instead of vanishing silently).
      #
      # Extracted to checkRejectedMarker.mjs (2026-07-27) rather than staying
      # inline bash specifically so it's unit-tested (checkRejectedMarker.
      # test.mjs) — the prior inline version silently reported `false` both
      # when the .rejected/ directory genuinely had nothing new AND when the
      # directory didn't exist at all, which are not the same answer: a
      # checkpoint whose job is "was a marker written" must never report a
      # confident false on a question it couldn't actually answer (same bug
      # class as the implicit success() incident this workflow already
      # documents below). The script reports a third, distinct `unknown`
      # state for the missing-directory case instead.
      - name: Check whether a rejected-attempt marker was written
        id: check_rejected
        if: always()
        run: node tools/blog-generator/checkRejectedMarker.mjs >> "$GITHUB_OUTPUT"

      # Auto-publish gate (owner decision, 2026-08-03) — reads the
      # STRUCTURED report generate.mjs wrote (report.allSilent, computed by
      # autoPublishGate.mjs), never the job log. "Don't parse logs" applies
      # here the same way it already applies to has_new_article/
      # has_rejected_marker above. Safe to run unconditionally (always()):
      # checkAllSilent.mjs fails closed on a missing report or a non-
      # 'generated' outcome, so it correctly reports all_silent=false on a
      # tripped/skipped run without needing its own extra guard condition.
      - name: Check whether the run was perfectly silent (auto-publish eligible)
        id: check_silent
        if: always()
        run: node tools/blog-generator/checkAllSilent.mjs >> "$GITHUB_OUTPUT"

      # Only reached (and only opens a PR) when generate.mjs actually wrote a
      # new file — a tripped/skipped/failed run has nothing new under
      # src/data/generated-articles/, so this step is a no-op and the job's
      # overall status stays failed from the generate step above (visibly
      # red, per the build spec — never silent).
      #
      # success() is explicit here even though it's currently redundant
      # (has_new_article can only be true when the generate step itself
      # succeeded) — written out so it's a stated decision, not something a
      # future reader has to know GitHub Actions' implicit-if-gating rule to
      # infer. See the sibling rejected-attempt step below for why this
      # actually matters, not just for symmetry.
      - name: Open PR with the generated article
        id: open_pr
        if: success() && steps.check.outputs.has_new_article == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "blog: add generated article draft"
          branch: "blog-generator/auto-${{ github.run_id }}"
          title: "[Blog draft] New generated article — review and edit before merging"
          body: ${{ steps.report.outputs.body }}
          add-paths: |
            src/data/generated-articles/
            tools/blog-generator/citation-host-log.json
          # citation-host-log.json (added 2026-07-26): a bot-blocked
          # citation host is worth recording even on a run that otherwise
          # succeeds -- see citationHostLog.mjs. This is a durable,
          # committed file (not gitignored) specifically so it accumulates
          # across articles instead of resetting on every fresh CI
          # checkout; it needs to ride along in whichever PR the run opens.
          #
          # topics.json is deliberately NOT listed here (removed 2026-07-26)
          # -- generate.mjs no longer writes to it at all now that topic
          # availability is derived from ground truth (see
          # topicAvailability.mjs), so it never has anything to stage. This
          # entry used to matter when topics.json's status field got
          # flipped per run; leaving a stale add-paths entry after that
          # write path was removed is exactly the class of dead-reference
          # drift that's worth deleting on sight rather than leaving as
          # unexplained noise.
          #
          # labels: intentionally omitted for the first run — an unknown label
          # (blog-draft / needs-human-review, neither created in the repo yet)
          # can fail PR creation on some action versions. Create the labels
          # first if you want them, then re-add this block; don't guess.

      # "PR body carries preview link + gate summary at top" (hardening
      # batch item 3, 2026-08-25) — a real-article PR's body is a long,
      # detailed gate report, easy to read on a desktop, painful to scroll
      # on a phone. This prepends a short marked block (the Cloudflare
      # Pages branch preview link + a one-line gate summary) so a human
      # deciding whether to merge from the GitHub mobile app sees the
      # essentials first. Polls for the Cloudflare Pages check itself
      # (up to 5 minutes) rather than trusting `gh pr checks --watch`,
      # which would also wait on build-check and could be blocked by an
      # unrelated failure there — this only needs Cloudflare's own check.
      #
      # continue-on-error: true -- this is a convenience feature, never a
      # gate. If it fails or times out (network hiccup, Cloudflare's check
      # summary shape changes), the PR still has its full, real report as
      # the body; a human just loses the top-of-body convenience, not any
      # actual information. See updatePrPreviewLink.mjs's own header
      # comment for the same non-fatal-by-design reasoning at the script
      # level -- this is the second, independent layer of that guarantee.
      - name: Update PR body with preview link + gate summary at top
        id: update_pr_body
        if: success() && steps.check.outputs.has_new_article == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node tools/blog-generator/updatePrPreviewLink.mjs \
            --pr="${{ steps.open_pr.outputs.pull-request-number }}" \
            --sha="${{ steps.open_pr.outputs.pull-request-head-sha }}"

      # ----------------------------------------------------------------
      # Email notifications (added 2026-08-25) — non-gating everywhere:
      # every notify step below sets continue-on-error: true, and the
      # notify-email composite action (.github/actions/notify-email) has
      # its own internal catch (a missing NOTIFY_SMTP_USERNAME/PASSWORD
      # cleanly no-ops with a log line, never a failure) as a second,
      # independent layer of the same guarantee. See
      # tools/blog-generator/README.md, "Email notifications," for the
      # full trigger list, the exact `gh secret set` commands, and how to
      # add a second recipient later.
      #
      # Deliberately gated on all_silent != 'true' — a perfectly-silent
      # run's PR opens and auto-merges/auto-publishes within the same job
      # run, seconds apart; "a new article awaits your review" would be
      # actively misleading for a PR that's already being auto-published
      # by the time the email could plausibly be read. The silent path
      # gets its own "published" email below instead (same as the human-
      # read path, just triggered differently) — every real article still
      # gets exactly one notification, never zero, never a confusing two.
      # ----------------------------------------------------------------
      - name: Build email content (article PR opened, held for review)
        id: email_article_pr
        if: success() && steps.check.outputs.has_new_article == 'true' && steps.check_silent.outputs.all_silent != 'true'
        continue-on-error: true
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=article-pr \
            --report=tools/blog-generator/.last-run-report.json \
            --preview-url="${{ steps.update_pr_body.outputs.preview_url }}" \
            --pr-url="${{ steps.open_pr.outputs.pull-request-url }}"

      - name: Notify (email) — article PR opened, held for review
        if: success() && steps.check.outputs.has_new_article == 'true' && steps.check_silent.outputs.all_silent != 'true'
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: ${{ steps.email_article_pr.outputs.subject }}
          html_body: ${{ steps.email_article_pr.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      # Records a gate trip as ground truth instead of leaving no trace
      # anywhere — a discarded run used to just vanish, which meant a
      # repeatedly-failing topic silently blocked the whole queue forever
      # (nothing anywhere would show why). This PR's branch name is
      # run-ID-scoped so a human closing this PR and rerunning opens a fresh
      # one with no name collision. Body is the same report as above, but
      # render-report-md.mjs withholds the "Article:" line for any outcome
      # other than 'generated' — this PR must never carry the discarded
      # draft's title, slug, or content, only the gate findings.
      #
      # always() is LOAD-BEARING, not decorative — this is the exact bug
      # this step would have shipped with without it. has_rejected_marker
      # only ever becomes 'true' when the "Run generator" step FAILED (a
      # gate trip always exits non-zero). GitHub Actions applies an implicit
      # success() to any custom `if:` that doesn't itself reference
      # always()/failure()/cancelled() (confirmed against GitHub's own docs
      # and cross-checked 2026-07-26, not assumed) -- so without always()
      # here, this step would be silently skipped on every single gate trip,
      # meaning the rejected-attempt PR this whole mechanism exists to open
      # would never actually fire in real CI. Caught by re-deriving this
      # from first principles rather than trusting the step "looked right."
      #
      # This does NOT weaken "the job must still exit non-zero on a trip":
      # that guarantee comes from the generate step's own exit code, not
      # from this step succeeding or being reached at all. If THIS step
      # itself fails (API error, rate limit, branch-name collision), the
      # job is already red from the generate step -- a failure here adds a
      # second red mark, never turns a trip green.
      - name: Open PR for rejected attempt (marker only — no article content)
        id: open_pr_rejected
        if: always() && steps.check_rejected.outputs.has_rejected_marker == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "blog: record rejected generation attempt (no article content)"
          branch: "blog-generator/rejected-${{ github.run_id }}"
          title: "[Blog draft] Rejected generation attempt — topic released if closed unmerged"
          body: ${{ steps.report.outputs.body }}
          add-paths: |
            src/data/generated-articles/.rejected/
            tools/blog-generator/citation-host-log.json

      - name: Build email content (rejected-attempt PR opened)
        id: email_rejected_pr
        if: always() && steps.check_rejected.outputs.has_rejected_marker == 'true'
        continue-on-error: true
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=rejected-pr \
            --report=tools/blog-generator/.last-run-report.json \
            --pr-url="${{ steps.open_pr_rejected.outputs.pull-request-url }}"

      - name: Notify (email) — rejected-attempt PR opened
        if: always() && steps.check_rejected.outputs.has_rejected_marker == 'true'
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: ${{ steps.email_rejected_pr.outputs.subject }}
          html_body: ${{ steps.email_rejected_pr.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      # ----------------------------------------------------------------
      # Automated publishing (owner decision, 2026-08-03) — see
      # tools/blog-generator/README.md "Automated publishing" for the
      # full condition list, the retrospective-audit compensating
      # control, and the one-commit unpublish rollback line.
      #
      # Gated on steps.check_silent.outputs.all_silent == 'true', which
      # is ONLY 'true' when report.outcome === 'generated' AND
      # report.allSilent === true (autoPublishGate.mjs) — Layer 1 zero
      # findings including log-only, Layer 2 all checks false, Layer 3
      # every citation RESOLVED, self-review zero violations, schema
      # already guaranteed clean by construction (a schema-invalid draft
      # never reaches outcome: 'generated' at all). ANY finding anywhere
      # leaves all_silent at 'false' and both steps below are no-ops —
      # the PR opened above simply sits, exactly like every PR before
      # this change, waiting for a supervised human read.
      # ----------------------------------------------------------------

      # Waits for the PR's own required checks (build-check, Cloudflare
      # Pages preview) before merging — never merges on the strength of
      # "the run was silent" alone. `gh pr checks --watch` blocks until
      # every check resolves and exits non-zero if any of them failed,
      # which aborts this step (bash's default `-e` for GitHub Actions
      # `run:` blocks) before the merge command ever runs — a silent
      # article whose build genuinely breaks does NOT get merged just
      # because the content gates were clean.
      - name: Auto-merge (perfectly silent run only)
        id: auto_merge
        if: success() && steps.check.outputs.has_new_article == 'true' && steps.check_silent.outputs.all_silent == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.open_pr.outputs.pull-request-number }}"
          echo "[auto-merge] perfectly silent run -- waiting for PR #$PR_NUMBER's required checks before merging..."
          gh pr checks "$PR_NUMBER" --watch
          echo "[auto-merge] checks passed -- merging PR #$PR_NUMBER."
          gh pr merge "$PR_NUMBER" --merge --delete-branch

      # Runs only after a successful auto-merge above. Fetches the just-
      # merged main fresh (never assumes what branch/state the workspace
      # was left on by the create-pull-request action) and performs the
      # exact same "full sequence" a human previously did across two
      # commits (published:true flip, _headers cache entry) — here as one
      # atomic commit, since there's no separate human judgment call
      # splitting them on this path: the auto-merge itself IS the
      # combined decision. setPublished.mjs and headersCacheEntry.mjs
      # both fail closed (throw, non-zero exit, `-e` aborts the step) —
      # on either failure the article lands on main merged but left
      # published:false, a safe, visibly-incomplete state, never wrongly
      # live. A step failure here still leaves the job red.
      - name: Publish (perfectly silent run only) — flip published:true, add _headers entry, commit, push
        if: success() && steps.auto_merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG="${{ steps.check_silent.outputs.article_slug }}"
          git fetch origin main
          git checkout -B main origin/main
          node tools/blog-generator/setPublished.mjs --slug="$SLUG" --value=true
          node tools/blog-generator/headersCacheEntry.mjs --slug="$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/data/generated-articles/${SLUG}.json" public/_headers
          git commit -m "blog: auto-publish \"$SLUG\" (perfectly silent run)

          Merge + published:true flip + _headers cache entry, done
          automatically because this run tripped nothing anywhere: Layer 1
          zero findings (including log-only), Layer 2 all checks false,
          Layer 3 every citation RESOLVED, self-review zero violations.
          See tools/blog-generator/README.md, \"Automated publishing\",
          for the full condition list and the retrospective-audit
          compensating control that reviews everything this path
          publishes.

          Run: ${{ github.run_id }}"
          git push origin main

      - name: Build email content (published — silent auto-publish)
        id: email_published_silent
        if: success() && steps.auto_merge.outcome == 'success'
        continue-on-error: true
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=published \
            --slug="${{ steps.check_silent.outputs.article_slug }}"

      - name: Notify (email) — published (silent auto-publish)
        if: success() && steps.auto_merge.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: ${{ steps.email_published_silent.outputs.subject }}
          html_body: ${{ steps.email_published_silent.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}

      # ----------------------------------------------------------------
      # Red-run notification (queue exhausted / generic failure). Fires
      # ONLY when the job failed AND neither PR type opened — a gate trip
      # or schema/link/identity discard already gets its own "rejected-
      # attempt PR opened" email above (and already correctly names its
      # real cause -- deriveFailureClassLabel/summarizeRejectionFindings,
      # notificationEmail.mjs -- this section covers what's LEFT: the
      # failure modes that leave no PR at all: queue exhausted, a missing
      # secret, a network/infrastructure error, an uncaught exception, or
      # generation succeeding but a LATER step failing). `failure()` (not
      # `always()`) is deliberate and explicit here — this step must only
      # run on a real red run.
      #
      # checkGenerateFailureReason.mjs (2026-08-31, notification-hardening
      # pass, Task 3) replaces what used to be a two-branch hardcoded
      # guess here ("report missing -> probably queue exhausted, missing
      # secret, or infra" / "report exists -> pipeline failure after
      # generation") -- the first branch would have confidently blamed the
      # topic queue on ANY no-report failure, including this exact
      # workflow's own identity-gate trips before they got their own
      # early-exit reports. See README.md's decision record for the full
      # incident and the strict structured-report > captured-log > neutral
      # precedence this now follows. See checkGenerateFailureReason.mjs's
      # own header comment for exactly what it reads and why.
      - name: Determine failure reason (structured report > captured log > neutral)
        id: failure_reason
        if: failure() && steps.check.outputs.has_new_article != 'true' && steps.check_rejected.outputs.has_rejected_marker != 'true'
        run: node tools/blog-generator/checkGenerateFailureReason.mjs --detail-out=/tmp/generate-failure-detail.txt >> "$GITHUB_OUTPUT"

      - name: Build email content (red run)
        id: email_failure
        if: failure() && steps.check.outputs.has_new_article != 'true' && steps.check_rejected.outputs.has_rejected_marker != 'true'
        continue-on-error: true
        run: |
          node tools/blog-generator/buildNotificationEmailCli.mjs \
            --kind=failure \
            --reason="${{ steps.failure_reason.outputs.reason }}" \
            --detail-file=/tmp/generate-failure-detail.txt \
            --slug="${{ steps.failure_reason.outputs.slug }}" \
            --failure-class="${{ steps.failure_reason.outputs.failure_class }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify (email) — red run
        if: failure() && steps.check.outputs.has_new_article != 'true' && steps.check_rejected.outputs.has_rejected_marker != 'true'
        continue-on-error: true
        uses: ./.github/actions/notify-email
        with:
          subject: ${{ steps.email_failure.outputs.subject }}
          html_body: ${{ steps.email_failure.outputs.html_body }}
          smtp_username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          smtp_password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
