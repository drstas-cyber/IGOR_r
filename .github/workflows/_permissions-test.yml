name: permissions-test

# THROWAWAY — tests whether contents:write + pull-requests:write is enough
# for peter-evans/create-pull-request@v6 to open a PR, decoupled from the
# real generator run so this isn't discovered on the run that actually
# matters. Deleted immediately after the test (see the 2026-07-26 session
# that added and removed this file in the same sitting).

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make a trivial no-op change
        run: echo "permissions test $(date -u +%s)" > PERMISSIONS_TEST.tmp

      - name: Open a throwaway PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "test: contents:write + pull-requests:write no-op"
          branch: "permissions-test/${{ github.run_id }}"
          title: "[TEST] Permissions check — safe to close, will be deleted"
          body: "Throwaway PR verifying create-pull-request works with just contents:write + pull-requests:write. Closed and branch deleted immediately after confirmation."
